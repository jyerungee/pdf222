<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 쉬운 해설 & 카드뉴스 생성기</title>
  <!-- Tailwind CSS CDN -->
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <!-- Pretendard Font CDN -->
  <link rel="stylesheet" as="style" crossorigin href="[https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css](https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css)" />
  <style>
    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    /* 클레이모피즘(Claymorphism) 스타일 유틸리티 */
    .clay-card {
      background: #ffffff;
      border-radius: 2rem;
      box-shadow: 0 16px 32px -4px rgba(79, 70, 229, 0.1), 0 8px 16px -2px rgba(0, 0, 0, 0.05), inset 0 -4px 8px rgba(0, 0, 0, 0.03), inset 0 4px 8px rgba(255, 255, 255, 0.9);
      border: 3px solid rgba(238, 242, 255, 0.8);
    }
    .clay-dropzone {
      background: #f8fafc;
      border-radius: 1.5rem;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.04), inset 0 -4px 8px rgba(255, 255, 255, 0.8);
      border: 3px dashed #cbd5e1;
      transition: all 0.2s ease;
    }
    .clay-dropzone:hover {
      background: #eef2ff;
      border-color: #6366f1;
    }
    .clay-button {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border-radius: 1.25rem;
      box-shadow: 0 10px 20px -3px rgba(79, 70, 229, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4), inset 0 -2px 4px rgba(0, 0, 0, 0.2);
      transition: all 0.15s ease;
    }
    .clay-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 24px -3px rgba(79, 70, 229, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.5), inset 0 -2px 4px rgba(0, 0, 0, 0.2);
    }
    .clay-button:active:not(:disabled) {
      transform: translateY(1px);
    }
    .clay-button:disabled {
      background: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
    }
    .clay-input {
      background: #f8fafc;
      border-radius: 1rem;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
      border: 2px solid #e2e8f0;
    }
    .clay-input:focus {
      outline: none;
      border-color: #6366f1;
      background: #ffffff;
    }
    .clay-subcard {
      background: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 8px 20px -3px rgba(0, 0, 0, 0.05), inset 0 2px 4px rgba(255, 255, 255, 0.8);
      border: 2px solid #f1f5f9;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-50 to-blue-100 min-h-screen text-slate-700 flex flex-col items-center py-12 px-4">

  <div class="w-full max-w-5xl space-y-8">

    <!-- 헤더 -->
    <header class="text-center space-y-3">
      <div class="inline-block bg-indigo-500 text-white text-xs font-bold px-4 py-1.5 rounded-full shadow-md uppercase tracking-wider mb-1">
        Claymorphic AI Lab
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-indigo-950">
        📄 PDF 논문 · 보고서 쉬운 해설 & 카드뉴스
      </h1>
      <p class="text-sm sm:text-base text-slate-500 font-medium">
        PDF 파일을 업로드하면 Gemini가 분석해 초등학생 해설과 카드뉴스를 만들어 드립니다!
      </p>
    </header>

    <!-- 메인 컨테이너 카드 -->
    <main class="clay-card p-6 sm:p-10 space-y-6">

      <!-- 업로드 카드 -->
      <div id="drop-zone" class="clay-dropzone p-8 text-center cursor-pointer flex flex-col items-center justify-center space-y-3">
        <div class="w-14 h-14 bg-indigo-100 rounded-2xl flex items-center justify-center shadow-inner text-indigo-600">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
          </svg>
        </div>
        <div class="space-y-1">
          <p class="text-base font-bold text-indigo-900">여기를 클릭하거나 PDF 파일을 드래그하여 업로드하세요</p>
          <p class="text-xs text-slate-400 font-medium">지원 형식: .pdf (최대 4MB)</p>
        </div>
        <input type="file" id="file-input" accept="application/pdf" class="hidden">
      </div>

      <!-- 선택된 파일명 표시 -->
      <div id="file-info" class="hidden flex items-center justify-between bg-emerald-50 border-2 border-emerald-200 rounded-2xl px-5 py-3.5 shadow-sm">
        <div class="flex items-center space-x-3 truncate">
          <span class="w-3 h-3 rounded-full bg-emerald-500 shadow shrink-0 animate-pulse"></span>
          <span id="file-name" class="text-sm font-bold text-emerald-950 truncate"></span>
        </div>
        <button id="file-remove" class="text-xs font-semibold text-slate-400 hover:text-red-600 transition ml-2 shrink-0 bg-white px-2.5 py-1 rounded-lg shadow-sm">취소</button>
      </div>

      <!-- 접속 코드 입력칸 (기본 숨김) -->
      <div id="access-code-container" class="hidden bg-amber-50 border-2 border-amber-200 rounded-2xl p-5 space-y-2 shadow-inner">
        <label for="access-code-input" class="block text-xs font-bold text-amber-800 uppercase tracking-wider">접속 코드 입력</label>
        <div class="flex space-x-2">
          <input type="password" id="access-code-input" placeholder="관리자에게 받은 접속 코드를 입력하세요" class="clay-input flex-1 px-4 py-3 text-sm">
          <button id="access-code-submit" class="px-5 py-3 bg-amber-600 hover:bg-amber-700 text-white font-bold text-sm rounded-xl shadow transition">확인</button>
        </div>
      </div>

      <!-- 분석 버튼 -->
      <button id="submit-btn" disabled class="clay-button w-full py-4 px-6 text-white font-bold text-base flex items-center justify-center space-x-2">
        <span>✨ PDF 분석 & 카드뉴스 생성하기</span>
      </button>

      <!-- 로딩 표시 -->
      <div id="loading-box" class="hidden flex flex-col items-center justify-center py-8 space-y-4">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent shadow-md"></div>
        <p class="text-sm font-bold text-indigo-900">PDF 파일을 읽고 Gemini가 분석 중입니다...</p>
      </div>

      <!-- 오류 박스 -->
      <div id="error-box" class="hidden bg-red-50 border-2 border-red-200 rounded-2xl p-4 text-sm text-red-700 font-bold shadow-sm"></div>

    </main>

    <!-- 결과 영역 (처음엔 숨김) -->
    <section id="result-section" class="hidden space-y-6">
      <div class="clay-card p-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <h2 class="text-xl font-extrabold text-indigo-950 flex items-center space-x-2">
          <span>🎯 분석 결과</span>
        </h2>
        <button id="copy-all-btn" class="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm rounded-xl shadow-md transition flex items-center space-x-2">
          <span>📋 전체 결과 복사하기</span>
        </button>
      </div>

      <!-- 카드 3개 컨테이너 -->
      <div class="space-y-6">

        <!-- 카드 1 -->
        <div class="clay-subcard overflow-hidden border-l-8 border-l-amber-400">
          <div class="bg-amber-50/70 px-6 py-4 border-b border-amber-100 flex items-center space-x-3">
            <span class="text-xl">👧</span>
            <h3 class="font-extrabold text-amber-900 text-base">초등학생도 이해하는 쉬운 말 해설</h3>
          </div>
          <div class="p-6">
            <p id="card1-content" class="text-slate-700 leading-relaxed whitespace-pre-line text-base font-medium"></p>
          </div>
        </div>

        <!-- 카드 2 -->
        <div class="clay-subcard overflow-hidden border-l-8 border-l-emerald-400">
          <div class="bg-emerald-50/70 px-6 py-4 border-b border-emerald-100 flex items-center space-x-3">
            <span class="text-xl">📌</span>
            <h3 class="font-extrabold text-emerald-900 text-base">핵심 테이크어웨이 (3줄 요약)</h3>
          </div>
          <div class="p-6">
            <ol id="card2-list" class="space-y-3.5"></ol>
          </div>
        </div>

        <!-- 카드 3 -->
        <div class="clay-subcard overflow-hidden border-l-8 border-l-indigo-500">
          <div class="bg-indigo-50/70 px-6 py-4 border-b border-indigo-100 flex items-center space-x-3">
            <span class="text-xl">📱</span>
            <h3 class="font-extrabold text-indigo-900 text-base">SNS 카드뉴스용 텍스트 (슬라이드 1 ~ 4)</h3>
          </div>
          <div class="p-6">
            <div id="card3-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
          </div>
        </div>

      </div>
    </section>

  </div>

  <!-- 토스트 알림 -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white text-sm font-bold px-6 py-3.5 rounded-2xl shadow-2xl flex items-center space-x-2 border border-slate-700">
    <span id="toast-msg">알림 메시지</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
